[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ds3-institutional-agent-control-plane"
version = "0.1.0"
description = "Governed shared agent control plane for DS3, Secure Chain OS, and CHRONOS"
requires-python = ">=3.11"
license = {text = "Proprietary - internal evaluation; obtain legal review before distribution"}
dependencies = ["fastapi>=0.115,<1.0", "uvicorn[standard]>=0.30,<1.0", "pydantic>=2.8,<3.0"]

[project.optional-dependencies]
test = ["pytest>=8.3,<9.0", "pytest-cov>=5.0,<7.0", "pytest-asyncio>=0.24,<1.0", "httpx>=0.27,<1.0", "ruff>=0.6,<1.0", "mypy>=1.11,<2.0"]

[project.scripts]
ds3-control-plane = "control_plane.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
